    - generic [ref=f1e65]:
      - heading "Helper Scripts" [level=2] [ref=f1e66]
      - paragraph [ref=f1e67]: Copy-and-paste commands for this server. Run them in an elevated PowerShell window on the target Windows machine.
      - generic [ref=f1e68]:
        - article [ref=f1e69]:
          - generic [ref=f1e70]:
            - heading "1. Install the Windows agent (no account required)" [level=3] [ref=f1e71]
            - button "Copy" [ref=f1e73] [cursor=pointer]:
              - generic [aria-hidden] [ref=f1e74]: 
              - text: Copy
          - generic [ref=f1e75]: "$script = \"$env:TEMP\\Install-Remotely.ps1\" irm 'http://127.0.0.1:5001/Content/Install-Remotely.ps1' -OutFile $script powershell.exe -ExecutionPolicy Bypass -File $script ` -ServerUrl 'http://127.0.0.1:5001' ` -OrganizationId ''"
          - paragraph [ref=f1e76]: Downloads the installer for this server, installs the persistent agent, and registers Remotely_Service.
        - article [ref=f1e77]:
          - generic [ref=f1e78]:
            - heading "2. Protect the agent service (watchdog)" [level=3] [ref=f1e79]
            - button "Copy" [ref=f1e81] [cursor=pointer]:
              - generic [aria-hidden] [ref=f1e82]: 
              - text: Copy
          - generic [ref=f1e83]: "$serviceName = 'Remotely_Service' $displayName = 'Arkan Remote Support - DO NOT STOP' # Start automatically and give the service an unmistakable name. sc.exe config $serviceName start= auto sc.exe config $serviceName DisplayName= \"$displayName\" # Restart the service on failure. sc.exe failure $serviceName reset= 900 actions= restart/5000/restart/10000/restart/30000 # Watchdog: restart within a minute if anything stops the service. $cmd = \"if ((Get-Service $serviceName -ErrorAction SilentlyContinue).Status -ne 'Running') { Start-Service $serviceName -ErrorAction SilentlyContinue }\" $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument \"-NoProfile -WindowStyle Hidden -Command `\"$cmd`\"\" $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(1) -RepetitionInterval (New-TimeSpan -Minutes 1) $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest Register-ScheduledTask -TaskName 'Remotely Service Watchdog' -Action $action -Trigger $trigger -Principal $principal -Force # Make sure it is running now. Start-Service $serviceName -ErrorAction SilentlyContinue # Park a stray portable \"Quick Support\" copy, if one was placed in the # install folder. This is NOT the unattended app: the agent launches # \"$env:ProgramFiles\\Remotely\\Desktop\\Remotely_Desktop.exe\" for every # remote control session, so that file must never be moved or renamed. $portableExe = Join-Path $env:ProgramFiles 'Remotely\\Remotely_Desktop.exe' if (Test-Path $portableExe) { Move-Item $portableExe \"$portableExe.disabled\" -Force } Get-Service $serviceName | Format-List Name, DisplayName, Status, StartType"
          - paragraph [ref=f1e84]:
            - text: Gives the service a clear name, restarts it automatically when it fails, registers a SYSTEM watchdog that restarts it within a minute, and parks a stray portable Quick Support copy. It never touches
            - code [ref=f1e85]: Remotely\Desktop\Remotely_Desktop.exe
            - text: ", which the agent needs for unattended control."
        - article [ref=f1e86]:
          - generic [ref=f1e87]:
            - heading "3. Undo the service protection" [level=3] [ref=f1e88]
            - button "Copy" [ref=f1e90] [cursor=pointer]:
              - generic [aria-hidden] [ref=f1e91]: 
              - text: Copy
          - generic [ref=f1e92]: "Unregister-ScheduledTask -TaskName 'Remotely Service Watchdog' -Confirm:$false $portableExe = Join-Path $env:ProgramFiles 'Remotely\\Remotely_Desktop.exe' if (Test-Path \"$portableExe.disabled\") { Move-Item \"$portableExe.disabled\" $portableExe -Force } sc.exe config Remotely_Service DisplayName= \"Remotely Service\""
          - paragraph [ref=f1e93]: Removes the watchdog and restores the original service name and the Quick Support executable.