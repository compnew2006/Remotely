name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:

  server:
    name: Server build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore Server/Server.csproj
          dotnet restore Tests/Server.Tests/Server.Tests.csproj

      - name: Build server
        run: dotnet build Server/Server.csproj -c Release --no-restore

      - name: Test
        run: dotnet test Tests/Server.Tests/Server.Tests.csproj -c Release --no-restore

  desktop:
    name: Desktop clients and shared tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Remotely.sln

      - name: Build solution
        run: dotnet build Remotely.sln -c Release --no-restore

      - name: Test shared
        run: dotnet test Tests/Shared.Tests/Shared.Tests.csproj -c Release --no-restore
